<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heatmap spike</title>
    <style>
      :root {
        --surface-1: #fcfcfb;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --text-muted: #898781;
        --border: rgba(11, 11, 11, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface-1: #cee0f8fc;
          --text-primary: #596ced;
          --text-secondary: #c3c2b7;
          --border: rgba(255, 255, 255, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--surface-1);
        color: var(--text-primary);
        overflow: hidden;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      .element {
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid var(--text-primary);
        transform: translate(-50%, -50%);
        z-index: 2;
        cursor: default;
      }

      #heat {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      #tooltip {
        position: fixed;
        z-index: 5;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--text-secondary);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        pointer-events: none;
        display: none;
        white-space: nowrap;
      }
      #tooltip strong {
        color: var(--text-primary);
        font-weight: 600;
      }
      #tooltip img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: block;
        margin-bottom: 4px;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 4;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      #hud h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      #legend-ramp {
        width: 160px;
        height: 10px;
        border-radius: 5px;
        border: 1px solid var(--border);
      }
      #legend-labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      #rescatter {
        margin-top: 10px;
        font: inherit;
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-primary);
        cursor: pointer;
      }
      #rescatter:hover {
        background: rgba(128, 128, 128, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <canvas id="heat"></canvas>

    <div id="hud">
      <!-- <h1>Contribution heatmap</h1>
      <div id="legend-ramp"></div>
      <div id="legend-labels"><span>0</span><span id="legend-max"></span></div>
      <button id="rescatter">Scatter again</button> -->
    </div>

    <div id="tooltip"></div>

    <script>
      // Thermal ramp: light blue -> dark blue -> green -> yellow -> red (hottest).
      const RAMP = [
        "#cde2fb",
        "#2a78d6",
        "#0d366b",
        "#008300",
        "#eda100",
        "#d03b3b",
      ];

      const ELEMENT_COUNT = 15;
      const RADIUS = 140; // heat blob radius in px
      const MAX_ALPHA = 0.8; // overlay opacity cap so elements stay visible

      const stage = document.getElementById("stage");
      const canvas = document.getElementById("heat");
      const ctx = canvas.getContext("2d");
      const tooltip = document.getElementById("tooltip");

      let elements = [];

      function generateElements() {
        return Array.from({ length: ELEMENT_COUNT }, (_, i) => ({
          id: i + 1,
          x: 0.05 + Math.random() * 0.9, // fractions of viewport, re-resolved on resize
          y: 0.05 + Math.random() * 0.9,
          contributionCount: Math.floor(Math.random() * 100) + 1,
          avatarUrl: `https://picsum.photos/seed/profile-${Math.floor(Math.random() * 1000)}/64`,
        }));
      }

      // Dominant color via histogram bucketing: quantize to 4 bits/channel,
      // skip near-white/near-black grays, weight buckets by saturation.
      function extractDominantColor(img) {
        const size = 32;
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(img, 0, 0, size, size);
        const data = g.getImageData(0, 0, size, size).data;

        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i],
            gr = data[i + 1],
            b = data[i + 2],
            a = data[i + 3];
          if (a < 128) continue;
          const max = Math.max(r, gr, b),
            min = Math.min(r, gr, b);
          if (max - min < 20 && (max > 230 || max < 25)) continue;
          const key = ((r >> 4) << 8) | ((gr >> 4) << 4) | (b >> 4);
          let bucket = buckets.get(key);
          if (!bucket)
            buckets.set(key, (bucket = { r: 0, g: 0, b: 0, n: 0, score: 0 }));
          const sat = max === 0 ? 0 : (max - min) / max;
          bucket.r += r;
          bucket.g += gr;
          bucket.b += b;
          bucket.n++;
          bucket.score += 1 + sat;
        }

        let best = null;
        for (const bucket of buckets.values()) {
          if (!best || bucket.score > best.score) best = bucket;
        }
        if (!best) return null;
        return {
          r: Math.round(best.r / best.n),
          g: Math.round(best.g / best.n),
          b: Math.round(best.b / best.n),
        };
      }

      function mixWithWhite({ r, g, b }, t) {
        const mix = (v) => Math.round(v + (255 - v) * t);
        return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
      }

      // 256-entry color lookup table built from the ramp.
      function buildLUT() {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 1;
        const g = c.getContext("2d", { willReadFrequently: true });
        const grad = g.createLinearGradient(0, 0, 256, 0);
        RAMP.forEach((hex, i) => grad.addColorStop(i / (RAMP.length - 1), hex));
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 1);
        return g.getImageData(0, 0, 256, 1).data;
      }
      const LUT = buildLUT();

      function renderElements() {
        stage.innerHTML = "";
        for (const el of elements) {
          const dot = document.createElement("div");
          dot.className = "element";
          dot.style.left = el.x * 100 + "%";
          dot.style.top = el.y * 100 + "%";

          const avatar = new Image();
          avatar.crossOrigin = "anonymous";
          avatar.src = el.avatarUrl;
          avatar.onload = () => {
            const color = extractDominantColor(avatar);
            if (!color) return;
            el.baseColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
            dot.style.borderColor = el.baseColor;
            dot.style.background = mixWithWhite(color, 0.75);
          };

          dot.addEventListener("mouseenter", (e) => {
            tooltip.innerHTML = `<img src="${el.avatarUrl}" alt="" />Element ${el.id} &middot; <strong>${el.contributionCount}</strong> contributions`;
            tooltip.style.display = "block";
            positionTooltip(e);
          });
          dot.addEventListener("mousemove", positionTooltip);
          dot.addEventListener("mouseleave", () => {
            tooltip.style.display = "none";
          });
          stage.appendChild(dot);
        }
      }

      function positionTooltip(e) {
        tooltip.style.left = e.clientX + 12 + "px";
        tooltip.style.top = e.clientY + 12 + "px";
      }

      function renderHeat() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;

        const maxCount = Math.max(...elements.map((e) => e.contributionCount));

        // 1) Accumulate intensity in the alpha channel: one soft radial blob per
        //    element, weighted by contributionCount relative to the max.
        ctx.clearRect(0, 0, w, h);
        for (const el of elements) {
          const cx = el.x * w;
          const cy = el.y * h;
          const weight = el.contributionCount / maxCount;
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, RADIUS);
          grad.addColorStop(0, `rgba(0,0,0,${weight})`);
          grad.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = grad;
          ctx.fillRect(cx - RADIUS, cy - RADIUS, RADIUS * 2, RADIUS * 2);
        }

        // 2) Colorize: map accumulated alpha through the ramp LUT.
        const img = ctx.getImageData(0, 0, w, h);
        const px = img.data;
        for (let i = 0; i < px.length; i += 4) {
          const a = px[i + 3];
          if (a === 0) continue;
          const j = Math.min(255, a) * 4;
          px[i] = LUT[j];
          px[i + 1] = LUT[j + 1];
          px[i + 2] = LUT[j + 2];
          px[i + 3] = Math.round(Math.min(255, a) * MAX_ALPHA);
        }
        ctx.putImageData(img, 0, 0);
      }

      function renderLegend() {
        const ramp = document.getElementById("legend-ramp");
        const max = document.getElementById("legend-max");
        if (!ramp || !max) return; // legend HUD may be commented out
        ramp.style.background = `linear-gradient(to right, ${RAMP.join(", ")})`;
        max.textContent =
          Math.max(...elements.map((e) => e.contributionCount)) +
          " contributions";
      }

      function scatter() {
        elements = generateElements();
        renderElements();
        renderHeat();
        renderLegend();
      }

      // document.getElementById("rescatter").addEventListener("click", scatter);
      window.addEventListener("resize", () => renderHeat());

      scatter();
    </script>
  </body>
</html>
